[project]
name = "smart-voice-recorder"
version = "0.1.0"
description = "Запись голоса с микрофона и локальная расшифровка в текст"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Интерфейс
    "PyQt6==6.11.0",
    # Запись с микрофона
    "sounddevice==0.5.6",
    "numpy==2.5.3",
    # Расшифровка локально, без интернета
    "faster-whisper==1.2.1",
    # Версия закреплена: av 17+ несовместим с faster-whisper
    "av==16.1.0",
]

[tool.poetry]
# Приложение запускается из исходников, сборка пакета не нужна
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    # Сборка в один файл — инструмент разработки, а не программы.
    # В рантайм-зависимостях ему не место: он весит больше ста мегабайт
    # и пользователю приложения не нужен.
    "pyinstaller (>=6.22.3,<7.0.0)",
]

[tool.ruff]
target-version = "py314"
line-length = 88
# Записи голоса и кэш модели — большие файлы, их незачем просматривать
extend-exclude = ["recordings", ".venv"]

[tool.ruff.lint]
# Набор закреплён здесь намеренно: без него вердикт линтера
# зависит от того, что в данный момент считает умолчанием ruff,
# и меняется при обновлении сам по себе.
select = [
    "E4",    # ошибки структуры
    "E7",
    "E9",
    "F",     # неиспользуемые имена, опечатки
    "W",     # пробелы, пустые строки
    "I",     # порядок импортов
    "UP",    # устаревшие конструкции
    "B",     # ошибки, которые не видно глазом
    "SIM",   # места, где код можно упростить
    "C4",    # list() вместо генераторов и наоборот
    "PTH",   # pathlib вместо os.path
    "RET",   # лишние return
    "PERF",
    "FURB",
    "S",     # опасные вызовы, например os.startfile
    "BLE",   # слишком широкий except
    "RUF",
]

# Записи читаются не текстом: длинные строки в разметке и подсказках
# это норма, а не ошибка
ignore = [
    "E501",
    # Проект написан по-русски. RUF001-003 ловят подмену букв
    # латиницей на похожие кириллические — на тексте это значит,
    # что каждое второе слово в комментарии считается подозрительным
    "RUF001",
    "RUF002",
    "RUF003",
]
